name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'halpha_gui.py'
      - 'halpha_engine.py'
      - 'requirements.txt'
      - '.github/workflows/build-windows.yml'

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Build standalone GUI
        run: |
          python -m PyInstaller --noconfirm --clean --onefile --windowed --name H-alpha-Solar-Analyzer --collect-all tzdata halpha_gui.py

      - name: Upload Windows executable
        uses: actions/upload-artifact@v4
        with:
          name: H-alpha-Solar-Analyzer-Windows
          path: dist/H-alpha-Solar-Analyzer.exe
          if-no-files-found: error
          retention-days: 30
